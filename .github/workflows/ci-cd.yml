name: DeepShield CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.11, 3.13]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run linting
      run: |
        pip install flake8 black isort
        flake8 backend/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        black --check backend/ tests/
        isort --check-only backend/ tests/

    - name: Run tests
      env:
        USE_SQLITE_RUNTIME: "true"
        SECRET_KEY: "test-secret-key-for-ci"
        DATABASE_URL: "sqlite:///./test.db"
      run: |
        python -m pytest tests/ -v --cov=backend --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        pip install bandit safety

    - name: Run Bandit security scan
      run: |
        bandit -r backend/ -f json -o bandit-report.json || true

    - name: Run Safety vulnerability check
      run: |
        safety check --json > safety-report.json || true

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  load-test:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Start application
      run: |
        python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 &
        sleep 10

    - name: Run load tests
      run: |
        python load_test.py --url http://localhost:8000 --users 5 --duration 30 --output load_test_results.json

    - name: Upload load test results
      uses: actions/upload-artifact@v3
      with:
        name: load-test-results
        path: load_test_results.json

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Deploy to staging
      run: |
        # Build and push Docker image
        docker build -t deepshield:staging .
        docker tag deepshield:staging ${{ secrets.ECR_REGISTRY }}/deepshield:staging
        docker push ${{ secrets.ECR_REGISTRY }}/deepshield:staging

        # Deploy to ECS/EKS or your staging environment
        echo "Deploying to staging environment..."

  deploy-production:
    runs-on: ubuntu-latest
    needs: [test, security-scan, load-test]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Deploy to production
      run: |
        # Build and push Docker image
        docker build -t deepshield:latest .
        docker tag deepshield:latest ${{ secrets.ECR_REGISTRY }}/deepshield:latest
        docker push ${{ secrets.ECR_REGISTRY }}/deepshield:latest

        # Deploy to ECS/EKS or your production environment
        echo "Deploying to production environment..."

        # Run smoke tests
        echo "Running production smoke tests..."

  notify:
    runs-on: ubuntu-latest
    needs: [test, security-scan, load-test]
    if: always()

    steps:
    - name: Notify on failure
      if: failure()
      run: |
        echo "Pipeline failed - sending notification..."
        # Add your notification logic here (Slack, email, etc.)

    - name: Notify on success
      if: success()
      run: |
        echo "Pipeline succeeded - sending notification..."
        # Add your notification logic here (Slack, email, etc.)